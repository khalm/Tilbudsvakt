name: Sjekk tilbud

on:
  schedule:
    # Hver tredje time (GitHub bruker UTC). Nye ønsker sjekkes med en gang i appen.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      testsok:
        description: 'Prøv et søk uten å lagre eller varsle (f.eks. håndkle)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sjekk-tilbud
  cancel-in-progress: false

jobs:
  sjekk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test matcheren
        run: npm test

      - name: Installer push-bibliotek
        run: npm install --no-save --no-audit --no-fund web-push@3

      - name: Hent tilbud og varsle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KASSALAPP_API_KEY: ${{ secrets.KASSALAPP_API_SECRET || secrets.KASSALAPP_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TESTSOK: ${{ github.event.inputs.testsok }}
        run: node scripts/sjekk.mjs

      - name: Lagre historikk
        run: |
          git config user.name "Tilbudsvakt"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Ingen endringer."
          else
            git commit -m "Oppdater historikk $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash || true
            git push
          fi
