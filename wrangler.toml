# Generert/oppdatert av .github/workflows/deploy.yml (KV-ID settes der).
name = "tilbudsvakt"
main = "worker/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "TILBUD"
id = "SETTES_AV_DEPLOY"
